<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | EduBoard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <nav class="sidebar">
    <h2 class="logo">EduBoard</h2>
    <ul class="nav-links">
      <li><a href="index.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
      <li><a href="subjects.html"><i class="fa-solid fa-book"></i> Subjects</a></li>
      <li><a href="attendance.html"><i class="fa-solid fa-calendar-check"></i> Attendance</a></li>
      <li><a href="profile.html"><i class="fa-solid fa-user"></i> Profile</a></li>
      <li><a href="settings.html" class="active"><i class="fa-solid fa-gear"></i> Settings</a></li>
    </ul>
  </nav>

  <div class="main-content">
    <header class="topbar">
      <div class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></div>
      <div class="profile-section">
        <i class="fa-solid fa-bell"></i>
        <img src="https://via.placeholder.com/40" alt="Avatar" class="avatar">
        <span class="student-name">Prabhakaran</span>
      </div>
    </header>

    <main>
      <section class="settings-section">
        <h2>Account Settings</h2>
        <form class="settings-form">
          <label>Name: <input type="text" value="Prabhakaran"></label>
          <label>Email: <input type="email" value="prabhakaran@college.edu"></label>
          <label>Password: <input type="password" placeholder="••••••••"></label>
          <label>Theme:
            <select>
              <option>Light Mode</option>
              <option>Dark Mode</option>
            </select>
          </label>
          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    const toggle = document.getElementById('menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    toggle.addEventListener('click', () => sidebar.classList.toggle('active'));
  </script>
</body>
</html>
